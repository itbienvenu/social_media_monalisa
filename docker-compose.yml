services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-social_platform}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - backend-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    networks:
      - backend-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-social_platform}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
    volumes:
      - ./services/api-gateway:/app/services/api_gateway
      - ./libs:/app/libs
    networks:
      - backend-network

  post-orchestrator:
    build:
      context: .
      dockerfile: services/post-orchestrator/Dockerfile
    environment:
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-social_platform}
    depends_on:
      - db
    networks:
      - backend-network

  facebook-service:
    build:
      context: .
      dockerfile: services/facebook-service/Dockerfile
    environment:
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-social_platform}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - LOGIN_REDIRECT_URL=${LOGIN_REDIRECT_URL}
      - MOCK_MODE=false
    depends_on:
      - db
    restart: always
    volumes:
      - ./services/facebook-service:/app/services/facebook_service
      - ./libs:/app/libs
    networks:
      - backend-network

  tiktok-service:
    build:
      context: .
      dockerfile: services/tiktok-service/Dockerfile
    env_file: .env
    environment:
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-social_platform}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASSWORD:-password}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/
      - REDIS_URL=redis://redis:6379/1
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - LOGIN_REDIRECT_URL=${LOGIN_REDIRECT_URL}
      - MOCK_MODE=false
    depends_on:
      - db
      - rabbitmq
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev
    networks:
      - backend-network

  linkedin-service:
    build:
      context: .
      dockerfile: services/linkedin-service/Dockerfile
    environment:
      - MOCK_MODE=${MOCK_MODE:-false}
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-social_platform}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - LOGIN_REDIRECT_URL=${LOGIN_REDIRECT_URL}
    networks:
      - backend-network

  analytics-collector:
    build:
      context: .
      dockerfile: services/analytics-collector/Dockerfile
    environment:
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-social_platform}
    depends_on:
      - db
    networks:
      - backend-network

  analytics-api:
    build:
      context: .
      dockerfile: services/analytics-api/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-social_platform}
    depends_on:
      - db
    networks:
      - backend-network

  instagram-service:
    build:
      context: .
      dockerfile: services/instagram-service/Dockerfile
    environment:
      - MOCK_MODE=false
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-social_platform}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - LOGIN_REDIRECT_URL=${LOGIN_REDIRECT_URL}
    networks:
      - backend-network

volumes:
  postgres_data:
  minio_data:

networks:
  backend-network:
    driver: bridge
